services:
  postgres:
    image: postgres:17-alpine
    # These credentials are for disposable local development only.
    environment:
      POSTGRES_DB: immortal
      POSTGRES_USER: immortal
      POSTGRES_PASSWORD: immortal_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immortal -d immortal"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
