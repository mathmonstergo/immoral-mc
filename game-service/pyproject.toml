[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "immortal-mmo-game-service"
version = "0.1.0"
description = "FastAPI Game Service for the Immortal Minecraft MMORPG."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.6.0",
    "testcontainers[postgres]>=4.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/immortal_mmo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
