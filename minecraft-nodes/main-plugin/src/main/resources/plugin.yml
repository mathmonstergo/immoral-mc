name: ImmortalMC
version: 0.1.0-SNAPSHOT
main: com.immortalmc.adapter.ImmortalMainPlugin
description: Adapter plugin for the ImmortalMC Game Service.
author: sensen
api-version: '1.21.11'
libraries:
  - com.fasterxml.jackson.core:jackson-databind:2.18.2
  - com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2
  - org.xerial:sqlite-jdbc:3.53.2.0
softdepend:
  - BetterHud
  - Citizens
  - MythicMobs
commands:
  immortal:
    description: ImmortalMC adapter operations.
    usage: /immortal <health|spirit-root|spirit-root-detector|npc-dialogue|quest|seclusion|breakthrough|cultivation|storage>
permissions:
  immortalmc.command:
    description: Allows use of ImmortalMC administrative commands.
    default: op
  immortalmc.cultivation:
    description: Allows players to use cultivation and breakthrough commands.
    default: true
  immortalmc.storage:
    description: Allows players to use regional storage in their current area.
    default: true
